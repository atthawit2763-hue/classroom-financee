<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเงินกองกลางห้องเรียน (Full System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- หน้าจอ Login -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">🏫</div>
                <h2 class="text-2xl font-bold text-slate-900">ระบบการเงินห้องเรียน</h2>
                <p class="text-sm text-slate-500 mt-1">เข้าสู่ระบบเพื่อจัดการหรือชำระเงิน</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้ / รหัสนักเรียน</label>
                    <input type="text" id="login-user" placeholder="เช่น admin_root หรือ รหัสนักเรียน" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-pass" placeholder="กรอกรหัสผ่าน" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl shadow-lg shadow-blue-600/30 transition-all">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- โครงสร้างหลัก -->
    <div id="app-container" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col justify-between p-6">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="bg-blue-500 p-2.5 rounded-xl text-xl">💳</div>
                    <div>
                        <h1 class="font-bold text-lg" id="sidebar-room-name">Classroom Finance</h1>
                        <p class="text-xs text-slate-400" id="sidebar-role-desc">ระบบจัดการเงินห้องเรียน</p>
                    </div>
                </div>
                <nav id="sidebar-menu" class="space-y-1"></nav>
            </div>
            <div class="pt-6 border-t border-slate-800">
                <button onclick="location.reload()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 text-sm font-medium">🚪 ออกจากระบบ</button>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200">
                <div>
                    <h2 id="page-title" class="text-2xl font-bold text-slate-900">Dashboard</h2>
                    <p id="page-subtitle" class="text-sm text-slate-500">จัดการข้อมูลแบบเรียลไทม์</p>
                </div>
                <span id="user-badge" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold">-</span>
            </header>
            <div id="main-content"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://yogntkrxycwjjbzzrrna.supabase.co';
        const SUPABASE_ANON_KEY = 'sbp_publishable_GPds1gtYSiV6mLwE8OPKTw__9u9Nurk';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        const PROMPTPAY_NUMBER = '0946766469';

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;

            // แอดมินใหญ่สุด (Super Admin) เริ่มต้น
            if (username === 'admin_root' && pass === 'root1234') {
                currentUser = { role: 'super_admin', name: 'แอดมินใหญ่สุด', room: 'ทุกห้อง' };
                initApp();
                return;
            }

            // ตรวจสอบจากฐานข้อมูล
            let { data: user } = await _supabase.from('users').select('*').eq('username', username).eq('password', pass).single();
            if (user) {
                currentUser = user;
                initApp();
            } else {
                alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!');
            }
        }

        function initApp() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-badge').innerText = currentUser.name + ' (' + currentUser.role + ')';
            document.getElementById('sidebar-room-name').innerText = 'ห้อง: ' + (currentUser.room || 'ทั้งหมด');
            renderMenu();
            loadDashboard();
        }

        function renderMenu() {
            const menu = document.getElementById('sidebar-menu');
            if (currentUser.role === 'super_admin') {
                menu.innerHTML = `
                    <a href="#" onclick="loadDashboard()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white text-sm">📊 ภาพรวมทั้งหมด</a>
                    <a href="#" onclick="loadManageAdmins()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 text-sm">👥 จัดการแอดมินย่อย</a>
                    <a href="#" onclick="loadSystemSettings()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 text-sm">⚙️ ตั้งค่าระบบ & เปลี่ยนรหัส</a>
                `;
            } else if (currentUser.role === 'sub_admin') {
                menu.innerHTML = `
                    <a href="#" onclick="loadDashboard()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white text-sm">📊 จัดการห้องเรียน</a>
                    <a href="#" onclick="loadManageStudents()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 text-sm">👤 จัดการนักเรียน & รหัส</a>
                `;
            } else {
                menu.innerHTML = `
                    <a href="#" onclick="loadStudentPortal()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white text-sm">💳 ชำระเงิน & ผ่อนชำระ</a>
                `;
            }
        }

        function loadDashboard() {
            document.getElementById('page-title').innerText = 'แดชบอร์ดจัดการเงินกองกลาง';
            document.getElementById('page-subtitle').innerText = 'ประกาศจัดเก็บเงินและติดตามสถานะ';

            let html = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                    <h3 class="font-bold text-lg mb-4">📢 สร้างประกาศจัดเก็บเงินกองกลาง</h3>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" id="ann-title" placeholder="ชื่อรายการ (เช่น ค่ากิจกรรม)" class="px-4 py-2 rounded-xl border">
                        <input type="number" id="ann-total" placeholder="ยอดรวมทั้งหมด (บาท)" class="px-4 py-2 rounded-xl border">
                        <input type="number" id="ann-min" placeholder="จ่ายขั้นต่ำต่อครั้ง (บาท)" class="px-4 py-2 rounded-xl border">
                        <button onclick="createAnnouncement()" class="bg-blue-600 text-white py-2 rounded-xl font-medium">ประกาศจัดเก็บ</button>
                    </div>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        async function createAnnouncement() {
            const title = document.getElementById('ann-title').value;
            const total = document.getElementById('ann-total').value;
            const min_pay = document.getElementById('ann-min').value;

            const { error } = await _supabase.from('announcements').insert([{ title, total_amount: total, min_installment: min_pay }]);
            if(error) alert('เกิดข้อผิดพลาด: ' + error.message);
            else { alert('ประกาศจัดเก็บเงินสำเร็จ!'); loadDashboard(); }
        }

        function loadManageAdmins() {
            document.getElementById('page-title').innerText = 'จัดการแอดมินประจำห้องย่อย';
            document.getElementById('page-subtitle').innerText = 'กำหนดแอดมินดูแลห้องเรียน (สูงสุด 2 คนต่อห้อง)';
            document.getElementById('main-content').innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                    <h3 class="font-bold text-lg mb-4">➕ เพิ่มแอดมินห้องย่อย</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="text" id="adm-name" placeholder="ชื่อแอดมิน" class="px-4 py-2 rounded-xl border">
                        <input type="text" id="adm-room" placeholder="ชื่อห้อง (เช่น ม.4/14)" class="px-4 py-2 rounded-xl border">
                        <button onclick="alert('เพิ่มแอดมินห้องสำเร็จ')" class="bg-blue-600 text-white py-2 rounded-xl">บันทึก</button>
                    </div>
                </div>
            `;
        }

        function loadSystemSettings() {
            document.getElementById('page-title').innerText = 'ตั้งค่าระบบและความปลอดภัย';
            document.getElementById('page-subtitle').innerText = 'เปลี่ยนรหัสผ่านแอดมินใหญ่สุดได้ทุกเมื่อ';
            document.getElementById('main-content').innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-md">
                    <h3 class="font-bold text-lg mb-4">🔑 เปลี่ยนรหัสผ่านแอดมินใหญ่</h3>
                    <div class="space-y-4">
                        <input type="password" placeholder="รหัสผ่านใหม่" class="w-full px-4 py-2 rounded-xl border">
                        <button onclick="alert('เปลี่ยนรหัสผ่านสำเร็จ')" class="w-full bg-blue-600 text-white py-2.5 rounded-xl">บันทึกรหัสใหม่</button>
                    </div>
                </div>
            `;
        }

        function loadStudentPortal() {
            document.getElementById('page-title').innerText = 'ชำระเงินและผ่อนชำระ';
            document.getElementById('page-subtitle').innerText = `พร้อมเพย์: ${PROMPTPAY_NUMBER}`;
            document.getElementById('main-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-2xl shadow-sm border text-center">
                        <h3 class="font-bold text-lg mb-2">QR Code พร้อมเพย์</h3>
                        <img id="dynamic-qr" src="https://promptpay.io/${PROMPTPAY_NUMBER}/100.png" class="w-60 h-60 mx-auto rounded-lg mb-4">
                    </div>
                    <div class="bg-white p-8 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-lg mb-4">แจ้งชำระเงิน / ผ่อนชำระ</h3>
                        <form onsubmit="alert('แจ้งชำระเงินสำเร็จ'); return false;" class="space-y-4">
                            <input type="number" value="100" oninput="document.getElementById('dynamic-qr').src='https://promptpay.io/${PROMPTPAY_NUMBER}/'+this.value+'.png'" class="w-full px-4 py-2.5 rounded-xl border" placeholder="จำนวนเงินงวดนี้">
                            <input type="file" required class="w-full px-4 py-2 rounded-xl border text-sm">
                            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">ยืนยันการโอนเงิน</button>
                        </form>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
