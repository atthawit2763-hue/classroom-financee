                document.getElementById('studentModalTitle').innerText = 'แก้ไขข้อมูลสมาชิก';
                document.getElementById('editStudentId').value = s.id;
                document.getElementById('stNumber').value = s.number;
                document.getElementById('stCode').value = s.studentCode;
                document.getElementById('stName').value = s.name;
                document.getElementById('stPhone').value = s.phone;
            } else {
                document.getElementById('studentModalTitle').innerText = 'เพิ่มสมาชิกใหม่';
                document.getElementById('studentForm').reset();
                document.getElementById('editStudentId').value = '';
            }

            document.getElementById('studentModal').classList.remove('flex');
            document.getElementById('studentModal').classList.add('hidden');

            e.preventDefault();
            const id = document.getElementById('editStudentId').value;
            const number = parseInt(document.getElementById('stNumber').value);
            const studentCode = document.getElementById('stCode').value;
            const name = document.getElementById('stName').value;
            const phone = document.getElementById('stPhone').value;

            if (id) {
                const s = state.students.find(x => x.id === id);
                s.number = number;
                s.studentCode = studentCode;
                s.name = name;
                s.phone = phone;
                showToast('แก้ไขข้อมูลสมาชิกสำเร็จ');
            } else {
                const newId = 'S' + String(state.students.length + 1).padStart(2, '0');
                state.students.push({
                    id: newId,
                    studentCode,
                    name,
                    number,
                    classroom: state.settings.className,
                    phone,
                    status: 'pending',
                    paidTotal: 0
                });
                showToast('เพิ่มสมาชิกใหม่สำเร็จ');
            }
            saveState();
            closeStudentModal();
            render();
        }

            if (!slip || slip.status !== 'pending') return;

            slip.status = 'approved';

            const student = state.students.find(st => st.id === slip.studentId);
            if (student) {
                student.paidTotal += slip.amount;
                if (student.paidTotal >= state.settings.targetAmount) {
                    student.status = 'paid';
                } else {
                    student.status = 'installing';
                }
            }

                payer: slip.studentName,
                details: 'ชำระเงินกองกลางผ่าน PromptPay QR',
                proof: slip.proof
            });

            render();

        // ==========================================
        // POST RENDER SCRIPTS (Charts & QR Code)
        // ==========================================
        function postRenderScripts() {
            const ctx = document.getElementById('financeChart');
            if (ctx) {
                const totalInc = state.income.reduce((s, i) => s + i.amount, 0);
                const totalExp = state.expenses.reduce((s, e) => s + e.amount, 0);

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.'],
                        datasets: [
                            { label: 'รายรับ', data: [0, 0, 0, 0, totalInc, 0], backgroundColor: '#059669', borderRadius: 8 },
                            { label: 'รายจ่าย', data: [0, 0, 0, 0, totalExp, 0], backgroundColor: '#e11d48', borderRadius: 8 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }

            const ctxPie = document.getElementById('memberPieChart');
            if (ctxPie) {
                const paidCount = state.students.filter(s => s.status === 'paid').length;
                const installingCount = state.students.filter(s => s.status === 'installing').length;
                const pendingCount = state.students.length - paidCount - installingCount;

                new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: ['ชำระครบ', 'กำลังผ่อน', 'ค้างชำระ'],
                        datasets: [{
                            data: [paidCount, installingCount, pendingCount > 0 ? pendingCount : 0],
                            backgroundColor: ['#059669', '#d97706', '#e11d48']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }

            const adminQrEl = document.getElementById('adminQrContainer');
            if (adminQrEl) {
                adminQrEl.innerHTML = '';
                new QRCode(adminQrEl, {
                    text: `https://promptpay.io/${state.settings.promptpayNumber}/${state.settings.targetAmount}`,
                    width: 180,
                    height: 180
                });
            }

            const studentQrEl = document.getElementById('studentQrContainer');
            if (studentQrEl) {
                studentQrEl.innerHTML = '';
                new QRCode(studentQrEl, {
                    text: `https://promptpay.io/${state.settings.promptpayNumber}/${state.settings.targetAmount}`,
                    width: 180,
                    height: 180
                });
            }
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
