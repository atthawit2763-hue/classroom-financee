<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเงินกองกลางและผ่อนชำระ (Multi-Room)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- หน้าจอ Login -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">🏫</div>
                <h2 class="text-2xl font-bold text-slate-900">ระบบการเงินห้องเรียน</h2>
                <p class="text-sm text-slate-500 mt-1">เข้าสู่ระบบเพื่อจัดการหรือชำระเงิน</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้ / รหัสนักเรียน</label>
                    <input type="text" id="login-user" placeholder="เช่น admin_root หรือ รหัสนักเรียน" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                    <input type="password" id="login-pass" placeholder="กรอกรหัสผ่าน" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl shadow-lg transition-all">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- โครงสร้างหลัก -->
    <div id="app-container" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col justify-between p-6">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="bg-blue-500 p-2.5 rounded-xl text-xl">💳</div>
                    <div>
                        <h1 class="font-bold text-lg" id="sidebar-room-name">Classroom Finance</h1>
                        <p class="text-xs text-slate-400" id="sidebar-role-desc">ระบบจัดการเงินห้องเรียน</p>
                    </div>
                </div>
                <nav id="sidebar-menu" class="space-y-1"></nav>
            </div>
            <div class="pt-6 border-t border-slate-800">
                <button onclick="location.reload()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-red-400 hover:bg-red-500/10 text-sm font-medium">🚪 ออกจากระบบ</button>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200">
                <div>
                    <h2 id="page-title" class="text-2xl font-bold text-slate-900">Dashboard</h2>
                    <p id="page-subtitle" class="text-sm text-slate-500">จัดการข้อมูลแบบเรียลไทม์</p>
                </div>
                <span id="user-badge" class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold">-</span>
            </header>
            <div id="main-content"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://yogntkrxycwjjbzzrrna.supabase.co';
        const SUPABASE_ANON_KEY = 'sbp_publishable_GPds1gtYSiV6mLwE8OPKTw__9u9Nurk';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;

            // แอดมินใหญ่สุด (Super Admin) เริ่มต้น
            if (username === 'admin_root' && pass === 'root1234') {
                currentUser = { role: 'super_admin', name: 'แอดมินใหญ่สุด', room: 'ทุกห้อง' };
                initApp();
                return;
            }

            // ตรวจสอบจากฐานข้อมูล users
            let { data: user } = await _supabase.from('users').select('*').eq('username', username).eq('password', pass).single();
            if (user) {
                currentUser = user;
                initApp();
            } else {
                alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!');
            }
        }

        function initApp() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-badge').innerText = currentUser.name + ' (' + currentUser.role + ')';
            document.getElementById('sidebar-room-name').innerText = 'ห้อง: ' + (currentUser.room || 'ทั้งหมด');
            renderMenu();
            loadDashboard();
        }

        function renderMenu() {
            const menu = document.getElementById('sidebar-menu');
            if (currentUser.role === 'super_admin') {
                menu.innerHTML = `
                    <a href="#" onclick="loadDashboard()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white text-sm">📊 จัดการห้องเรียนทั้งหมด</a>
                    <a href="#" onclick="loadManageRooms()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 text-sm">🏫 สร้าง/ตั้งค่าห้อง & พร้อมเพย์</a>
                `;
            } else if (currentUser.role === 'sub_admin') {
                menu.innerHTML = `
                    <a href="#" onclick="loadDashboard()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white text-sm">📊 ประกาศ & ตรวจสอบสลิป</a>
                `;
            } else {
                menu.innerHTML = `
                    <a href="#" onclick="loadStudentPortal()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600 text-white text-sm">💳 ชำระเงิน & ผ่อนชำระ</a>
                `;
            }
        }

        async function loadDashboard() {
            document.getElementById('page-title').innerText = 'แดชบอร์ดห้องเรียน: ' + (currentUser.room || 'ทั้งหมด');
            document.getElementById('page-subtitle').innerText = 'ภาพรวมการจัดเก็บเงินกองกลาง';
            
            let html = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <h3 class="font-bold text-lg mb-4">📢 สร้างประกาศจัดเก็บเงินกองกลาง</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="ann-title" placeholder="หัวข้อประกาศ (เช่น ค่ากิจกรรม)" class="px-4 py-2 rounded-xl border">
                    <input type="number" id="ann-total" placeholder="ยอดรวมทั้งหมด (บาท)" class="px-4 py-2 rounded-xl border">
                    <input type="number" id="ann-min" placeholder="จ่ายขั้นต่ำต่อครั้ง/งวด" class="px-4 py-2 rounded-xl border">
                    <button onclick="createAnnouncement()" class="col-span-full bg-blue-600 text-white py-2 rounded-xl font-medium">ประกาศจัดเก็บเงิน</button>
                </div>
            </div>`;
            document.getElementById('main-content').innerHTML = html;
        }

        // หน้าจัดการห้องเรียนและกำหนดเบอร์ PromptPay เฉพาะห้อง (สำหรับ Super Admin)
        async function loadManageRooms() {
            document.getElementById('page-title').innerText = 'จัดการห้องเรียนและพร้อมเพย์ประจำห้อง';
            document.getElementById('page-subtitle').innerText = 'สร้างห้องใหม่และกำหนดหมายเลขรับเงิน';

            let { data: rooms } = await _supabase.from('classrooms').select('*');
            let roomRows = '';
            if(rooms) {
                rooms.forEach(r => {
                    roomRows += `<tr><td class="px-6 py-4 font-medium">${r.room_name}</td><td class="px-6 py-4">${r.promptpay_number}</td></tr>`;
                });
            }

            document.getElementById('main-content').innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                    <h3 class="font-bold text-lg mb-4">➕ เพิ่มห้องเรียนใหม่</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="text" id="room-name" placeholder="ชื่อห้อง (เช่น ม.4/14)" class="px-4 py-2 rounded-xl border">
                        <input type="text" id="room-pp" placeholder="เบอร์ PromptPay ประจำห้อง" class="px-4 py-2 rounded-xl border">
                        <button onclick="createRoom()" class="bg-blue-600 text-white py-2 rounded-xl">บันทึกห้องเรียน</button>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b text-xs uppercase text-slate-500"><tr><th class="px-6 py-4">ห้องเรียน</th><th class="px-6 py-4">เบอร์พร้อมเพย์</th></tr></thead>
                        <tbody class="divide-y text-sm">${roomRows || '<tr><td colspan="2" class="px-6 py-4 text-center text-slate-400">ยังไม่มีห้องเรียน</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        async function createRoom() {
            const room_name = document.getElementById('room-name').value;
            const promptpay_number = document.getElementById('room-pp').value;
            const { error } = await _supabase.from('classrooms').insert([{ room_name, promptpay_number }]);
            if(error) alert('เกิดข้อผิดพลาด: ' + error.message);
            else { alert('สร้างห้องสำเร็จ!'); loadManageRooms(); }
        }

        async function createAnnouncement() {
            const title = document.getElementById('ann-title').value;
            const total = document.getElementById('ann-total').value;
            const min_pay = document.getElementById('ann-min').value;
            const { error } = await _supabase.from('announcements').insert([{ title, total_amount: total, min_installment: min_pay, room: currentUser.room }]);
            if(error) alert('เกิดข้อผิดพลาด');
            else { alert('ประกาศสำเร็จ!'); loadDashboard(); }
        }

        // หน้าชำระเงินและผ่อนชำระของนักเรียน (ดึงเบอร์ PromptPay ตามห้องของนักเรียน)
        async function loadStudentPortal() {
            document.getElementById('page-title').innerText = 'ชำระเงินกองกลาง & ผ่อนชำระ';
            document.getElementById('page-subtitle').innerText = `ห้องของคุณ: ${currentUser.room || 'นักเรียน'}`;

            // ดึงเบอร์ PromptPay ของห้องตนเองจากตาราง classrooms
            let { data: roomData } = await _supabase.from('classrooms').select('promptpay_number').eq('room_name', currentUser.room).single();
            const ppNumber = roomData ? roomData.promptpay_number : '0946766469';

            document.getElementById('main-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-2xl shadow-sm border text-center">
                        <h3 class="font-bold text-lg mb-2">QR Code พร้อมเพย์ห้อง ${currentUser.room}</h3>
                        <p class="text-sm text-slate-500 mb-4">พร้อมเพย์: ${ppNumber}</p>
                        <div class="inline-block p-4 bg-slate-50 border rounded-xl mb-4">
                            <img id="dynamic-qr" src="https://promptpay.io/${ppNumber}/100.png" class="w-60 h-60 mx-auto rounded-lg">
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-2xl shadow-sm border">
                        <h3 class="font-bold text-lg mb-4">แจ้งชำระเงินงวดนี้ / ผ่อนชำระ</h3>
                        <form onsubmit="submitPayment(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">จำนวนเงินที่ต้องการชำระ (บาท)</label>
                                <input type="number" id="pay-amount" value="100" oninput="document.getElementById('dynamic-qr').src='https://promptpay.io/${ppNumber}/'+this.value+'.png'" required class="w-full px-4 py-2.5 rounded-xl border">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">อัปโหลดสลิปโอนเงิน</label>
                                <input type="file" required class="w-full px-4 py-2 rounded-xl border text-sm">
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium">ยืนยันการแจ้งชำระเงิน</button>
                        </form>
                    </div>
                </div>
            `;
        }

        async function submitPayment(e) {
            e.preventDefault();
            const amount = document.getElementById('pay-amount').value;
            const { error } = await _supabase.from('payments').insert([{ student_name: currentUser.name, amount, room: currentUser.room, status: 'รอตรวจสอบ' }]);
            if(error) alert('เกิดข้อผิดพลาด');
            else alert('แจ้งชำระเงินสำเร็จ ระบบได้บันทึกประวัติการผ่อนชำระของคุณแล้ว');
        }
    </script>
</body>
</html>
